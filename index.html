if(!/^[1-9]\d{7,14}$/.test(d||""))return bad("Numéro WhatsApp invalide : utilisez le format international (ex. +225 07 00 00 00 00)");

if(/\s/.test(t))return bad("Le lien ne doit pas contenir d’espace");
let h=t;
if(!/^[a-z][a-z0-9+.-]*:/i.test(h)){

h="https://"+h}
let u;try{u=new URL(h)}catch(e){return bad("Lien invalide")}
if(u.protocol!=="https:"&&u.protocol!=="http:")return bad("Le lien doit commencer par https://");

function authWhy(e){const m=String(e&&e.message||"");
if(/invalid login/i.test(m))return"E-mail ou mot de passe incorrect.";
if(/not confirmed/i.test(m))return"Adresse e-mail non confirmée : ouvrez le lien reçu par e-mail.";
if(/already registered|already been registered/i.test(m))return"Un compte existe déjà avec cette adresse e-mail.";
if(/rate limit|too many/i.test(m))return"Trop de tentatives. Patientez quelques minutes puis réessayez.";
if(/password/i.test(m)&&/(short|least|weak)/i.test(m))return"Mot de passe trop faible (6 caractères minimum).";
if(/fetch|network|load failed/i.test(m))return"Réseau indisponible. Vérifiez votre connexion.";
return"Opération impossible"+(m?" ("+m+")":"")+"."}
async function loadProfile(au){const{data:p}=await sb.from("profiles").select("*").eq("id",au.id).maybeSingle();
const n=(p&&p.full_name)||(au.user_metadata&&au.user_metadata.full_name)||"",role=p?p.role:"client",a={id:au.id,n,tel:(p&&p.phone)||"",email:au.email,role,type:role==="vendeur"?"vendeur":"client",shop:"Boutique de "+n};
if(role==="vendeur"){const{data:q}=await sb.rpc("my_subscription"),x=Array.isArray(q)?q[0]:q;a.trialStart=Date.now();a.trialEnd=x&&x.expires_at?+new Date(x.expires_at):0}
return a}
async function login(){const id=$("#li").value.trim(),pw=$("#lp").value,er=$("#le");er.textContent="";
if(!id||!pw){er.textContent="Renseignez vos identifiants.";return}
if(!sb){er.textContent="Service indisponible : connexion impossible pour le moment.";return}
if(!/^\S+@\S+\.\S+$/.test(id)){er.textContent="Connectez-vous avec votre adresse e-mail.";return}
const{data,error}=await sb.auth.signInWithPassword({email:id,password:pw});
if(error){er.textContent=authWhy(error);return}
U=await loadProfile(data.user);toast("Connexion réussie");fin(U)}
function setTy(t){rty=t;$("#t1").classList.toggle("on",t==="client");$("#t2").classList.toggle("on",t==="vendeur")}
async function reg(){const n=$("#rn").value.trim(),t=$("#rt").value.replace(/\s/g,""),e=$("#re").value.trim(),p=$("#rp").value,er=$("#rr");er.textContent="";
if(!n||!t||!e||!p){er.textContent="Tous les champs sont obligatoires.";return}if(!/^\S+@\S+\.\S+$/.test(e)){er.textContent="Adresse e-mail invalide.";return}if(p.length<6){er.textContent="Mot de passe : 6 caractères minimum.";return}if(p!==$("#rc").value){er.textContent="Les mots de passe ne correspondent pas.";return}
if(!sb){er.textContent="Service indisponible : inscription impossible pour le moment.";return}
const{data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n,phone:t,role:rty==="vendeur"?"vendeur":"client"}}});
if(error){er.textContent=authWhy(error);return}
if(data.user&&data.user.identities&&!data.user.identities.length){er.textContent="Un compte existe déjà avec cette adresse e-mail.";return}
if(!data.session){er.textContent="Compte créé. Confirmez votre adresse e-mail grâce au lien reçu, puis connectez-vous.";return}
U=await loadProfile(data.user);toast("Compte créé");fin(U)}

async function resetPw(){const e=$("#fe").value.trim(),er=$("#fr");if(!/^\S+@\S+\.\S+$/.test(e)){er.textContent="Saisissez votre adresse e-mail.";return}
const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});
er.style.color=error?"":"inherit";er.textContent=error?authWhy(error):"Si cette adresse existe, un lien de réinitialisation vient d’être envoyé."}

const{error}=await sb.auth.updateUser({password:p});if(error){er.textContent=authWhy(error);return}toast("Mot de passe modifié");go("c-accueil")}
async function stk(i,d){if(!okV()||!own(i))return;const v=VP[i],n=Math.max(0,v.st+d);if(sb){const{error}=await sb.from("produits").update({stock:n}).eq("id",v.pid);if(error){toast("Modification refusée");return}}v.st=n;render()}

"v-apercu":()=>{if(!PV)return L["v-boutique"]();const pub=!!(shopOf(U.id)||{}).publie;return `<div class="wn">Aperçu de votre page publique. ${pub?"Les modifications ne sont visibles des clients qu’après publication.":"Votre boutique n’est pas encore visible des clients."}</div>${shopPage(PV,P.filter(p=>p.vid===U.id),U.id,true)}<div style="display:flex;gap:8px;margin:16px 0"><button class="b2" style="flex:1" onclick="go('v-boutique')">Modifier</button><button class="b" style="flex:1" onclick="shopPub()">${pub?"Publier les modifications":"Publier ma boutique"}</button></div>`},
"v-abo":()=>`<h1>Abonnements</h1><p style="opacity:.7;margin-bottom:12px">Gérez votre abonnement vendeur et choisissez une formule.</p>${subCard(1)}<h2>Nos formules</h2><div class="plans">${Object.keys(PL).map(planCard).join("")}</div>${wn()}${hist()}`,
"v-souscrire":()=>{const q=PL[psel];if(!q)return L["v-abo"]();const a=acc(),ex=SUBS.find(x=>x.vendeur_id===U.id&&x.formule===psel&&open_(x)),dc=ex&&ex.statut_paiement==="declare",dbt=a.paid?"Après votre abonnement actuel ("+dt(a.fin)+")":"À la confirmation du paiement";return `<h1>Souscription</h1><div class="card"><small>Formule choisie</small><h2 style="margin:2px 0 10px">${q.n}</h2><div class="row"><span class="f">Prix</span><b style="color:var(--g)">${F(q.p)}</b></div><div class="row"><span class="f">Durée</span><b>${q.du}</b></div><div class="row"><span class="f">Début</span><b style="text-align:right">${dbt}</b></div><div class="row"><span class="f">Statut du paiement</span>${tg(ex?PS[ex.statut_paiement]:"Paiement en attente")}</div></div><div class="card stp"><b>Étape 1 · Payer avec Wave</b><small>Montant exact à payer : ${F(q.p)}. Le lien s’ouvre dans Wave ou dans un nouvel onglet.</small><a class="wv" href="${waveUrl(psel)}" target="_blank" rel="noopener noreferrer" onclick="wavePay(event,'${psel}')">Payer avec Wave</a></div><div class="card stp"><b>Étape 2 · Déclarer mon paiement</b>${dc?`<div class="wn">Paiement déjà déclaré${ex.reference_paiement?" (référence "+ex.reference_paiement+")":""}. En attente de vérification par l’administrateur.</div>`:`<small>Une fois le paiement effectué, appuyez sur le bouton ci-dessous.</small><input id="rf" placeholder="Référence de la transaction Wave (facultatif)"><button class="b" id="dc" style="width:100%;margin-top:8px" onclick="declare()">J’ai effectué mon paiement</button>`}<div style="margin-top:10px">${proof()}</div></div>${wn()}<button class="b2" id="cf" style="width:100%" onclick="subscribe()">Confirmer mon abonnement</button><small style="display:block;opacity:.65;margin:6px 0">Enregistre seulement votre demande, sans paiement.</small><button style="width:100%;margin-top:6px" onclick="go('v-abo')">Retour aux formules</button>`},
"v-compte":()=>`<h1>Paramètres du compte</h1><div class="fm"><input value="${U.n}"><input value="${U.email}"><input value="${U.tel}"><button class="b" onclick="toast('Compte enregistré (démo)')">Enregistrer</button><button onclick="go('c-accueil')">Voir la marketplace</button><button class="dg" onclick="out()">Se déconnecter</button></div>`,
"a-accueil":()=>`<div class="kg">${kp("Clients",AC.length,0)}${kp("Vendeurs",AV.length,1)}${kp("Commandes",O.length,2)}${kp("Revenus abonnements",F(SUBS.reduce((t,x)=>t+(x.prix_paye||0),0)),3)}</div><h2>Activité</h2><div class="card">${bars([0,0,0,0,0,0,0],["L","M","M","J","V","S","D"])}<small style="opacity:.6">Aucune donnée pour le moment</small></div>`,
"a-clients":()=>`<h1>Clients</h1>${AC.length?`<div class="card">${AC.map((c,i)=>`<div class="row"><div class="f"><b>${c.n}</b><small>${c.v}</small></div>${tg(c.a?"Actif":"Suspendu")}<button onclick="AC[${i}].a^=1;render()">${c.a?"Suspendre":"Activer"}</button></div>`).join("")}</div>`:`<div class="card empty">Aucun client pour le moment</div>`}`,
"a-vendeurs":()=>`<h1>Vendeurs</h1>${AV.length?`<div class="card">${AV.map((c,i)=>`<div class="row"><div class="f"><b>${c.n}</b><small>Abonnement : ${(u=>u?acc(u).st:c.pl)(ACC.find(x=>x.id===c.id))}</small></div>${tg(c.a?"Actif":"Suspendu")}<button onclick="AV[${i}].a^=1;render()">${c.a?"Suspendre":"Activer"}</button></div>`).join("")}</div>`:`<div class="card empty">Aucun vendeur pour le moment</div>`}`,
"a-boutiques":()=>`<h1>Boutiques</h1>${AV.length?`<div class="card">${AV.map(s=>`<div class="row"><div class="th">🏪</div><div class="f"><b>${s.n}</b><small>${P.filter(p=>p.s===s.n).length} produit(s)</small></div>${tg(s.a?"Actif":"Suspendu")}</div>`).join("")}</div>`:`<div class="card empty">Aucune boutique pour le moment</div>`}`,
"a-produits":()=>`<h1>Produits</h1>${P.length?`<div class="card">${P.map(p=>`<div class="row"><div class="th">${thm(p)}</div><div class="f"><b>${p.n}</b><small>${p.s} · ${F(p.p)}</small></div><button class="dg" onclick="P=P.filter(x=>x.id!==${p.id});VP=VP.filter(v=>v.pid!==${p.id});render()">Retirer</button></div>`).join("")}</div>`:`<div class="card empty">Aucun produit disponible pour le moment</div>`}`,
"a-commandes":()=>`<h1>Commandes</h1>${O.length?`<div class="card">${O.map(o=>`<div class="row"><div class="f"><b>${o.id} · ${o.c}</b><small>${o.n}</small></div>${tg(o.s)}</div>`).join("")}</div>`:`<div class="card empty">Aucune commande pour le moment</div>`}`,
"a-categories":()=>`<h1>Catégories</h1><div class="card">${CT.map((c,i)=>`<div class="row"><div class="th">${c[1]}</div><b class="f">${c[0]}</b><button class="dg" onclick="CT.splice(${i},1);render()">✕</button></div>`).join("")}</div><div style="display:flex;gap:8px"><input id="nc" placeholder="Nouvelle catégorie"><button class="b" onclick="const v=$('#nc').value;if(v){CT.push([v,'🏷️']);render()}">Ajouter</button></div>`,
"a-abos":()=>{const pe=SUBS.filter(open_).sort((x,y)=>(y.statut_paiement==="declare")-(x.statut_paiement==="declare"));return `<h1>Abonnements</h1><h2>Paiements à vérifier</h2>${pe.length?pe.map(x=>`<div class="card"><div class="row" style="border:0"><div class="f"><b>${x.vendeur_nom||"Vendeur"}</b><small>${PL[x.formule].n} · ${F(x.prix)} · demandé le ${dt(x.created_at)}</small><small>${x.statut_paiement==="declare"?"Paiement déclaré le "+dt(x.declare_le)+(x.reference_paiement?" · réf. "+x.reference_paiement:""):"Paiement non encore déclaré par le vendeur"}</small></div>${tg(PS[x.statut_paiement])}</div><div style="display:flex;gap:8px"><button class="b" style="flex:1" onclick="if(confirm('Avez-vous bien reçu ${F(x.prix)} sur votre compte Wave ?'))subDec('${x.id}',1)">Confirmer le paiement</button><button class="dg" style="flex:1" onclick="subDec('${x.id}',0)">Refuser</button></div></div>`).join(""):`<div class="card empty">Aucun paiement à vérifier</div>`}<h2>Tous les abonnements</h2>${SUBS.length?`<div class="card">${SUBS.map(x=>`<div class="row"><div class="f"><b>${x.vendeur_nom||"Vendeur"}</b><small>${PL[x.formule].n}${x.date_expiration?" · expire le "+dt(x.date_expiration):""}</small></div>${tg(PS[x.statut_paiement])}</div>`).join("")}</div>`:`<div class="card empty">Aucun abonnement pour le moment</div>`}`},
"a-stats":()=>`<h1>Statistiques générales</h1><div class="kg">${kp("Ventes totales",F(0))}${kp("Boutiques",AV.length)}</div><div class="card" style="margin-top:10px">${bars([0,0,0,0,0,0],["Jun","Jul","Aoû","Sep","Oct","Nov"])}<small style="opacity:.6">Aucune donnée pour le moment</small></div>`,
"c-connexion":()=>`<div class="fm" style="max-width:420px;margin:24px auto"><h1 style="margin:0">Connexion</h1><p style="opacity:.7">Connectez-vous pour commander ou gérer votre boutique.</p><input id="li" type="email" placeholder="Adresse e-mail" autocomplete="username">${pw("lp","Mot de passe","current-password")}<div id="le" class="dg" style="font-size:13px"></div><button class="b" onclick="login()">Se connecter</button><a style="color:var(--g);cursor:pointer;text-align:center" onclick="go('c-oubli')">Mot de passe oublié ?</a><div style="text-align:center">Pas encore de compte ? <a style="color:var(--g);font-weight:600;cursor:pointer" onclick="go('c-inscription')">Créer un compte</a></div></div>`,
"c-inscription":()=>`<div class="fm" style="max-width:420px;margin:24px auto"><h1 style="margin:0">Créer un compte</h1><input id="rn" placeholder="Nom complet"><input id="rt" type="tel" placeholder="Numéro de téléphone"><input id="re" type="email" placeholder="Adresse e-mail">${pw("rp","Mot de passe","new-password")}${pw("rc","Confirmer le mot de passe","new-password")}<b>Type de compte</b><div class="chips"><span class="chip ${rty==="client"?"on":""}" id="t1" onclick="setTy('client')">Client</span><span class="chip ${rty==="vendeur"?"on":""}" id="t2" onclick="setTy('vendeur')">Vendeur</span></div><div id="rr" class="dg" style="font-size:13px"></div><button class="b" onclick="reg()">Créer mon compte</button><div style="text-align:center"><a style="color:var(--g);font-weight:600;cursor:pointer" onclick="go('c-connexion')">J’ai déjà un compte</a></div></div>`,
"c-oubli":()=>`<div class="fm" style="max-width:420px;margin:24px auto"><h1 style="margin:0">Mot de passe oublié</h1><input id="fe" type="email" placeholder="Adresse e-mail" autocomplete="email"><div id="fr" class="dg" style="font-size:13px"></div><button class="b" onclick="resetPw()">Envoyer le lien</button><a style="color:var(--g);cursor:pointer;text-align:center" onclick="go('c-connexion')">Retour à la connexion</a></div>`,
"c-nouveau-mdp":()=>`<div class="fm" style="max-width:420px;margin:24px auto"><h1 style="margin:0">Nouveau mot de passe</h1>${pw("np","Nouveau mot de passe","new-password")}${pw("nc","Confirmer le mot de passe","new-password")}<div id="nr" class="dg" style="font-size:13px"></div><button class="b" onclick="setNewPw()">Enregistrer</button></div>`};
function trial(){return subCard()}
function render(){let r=R();if(!L[r])r="c-accueil";
const need=/^(c-commande|c-commandes|c-profil|c-confirmation)$/.test(r)&&!U,vend=/^v-/.test(r)&&!(U&&U.type==="vendeur");
if(need||vend){if(vend&&U){toast("Espace réservé aux comptes vendeur");r="c-accueil"}else{nxt=r;toast(need?"Connectez-vous pour commander":"Connectez-vous avec un compte vendeur");r="c-connexion"}}
if(!need&&!vend&&/^v-(produits|ajout|commandes|clients|stats|boutique|reseaux|apercu)$/.test(r)&&!acc().ok){toast("Abonnement requis pour accéder à cette fonction");r="v-abo"}
if(r!==R()){location.hash=r;return}
const sp=(/^c-(connexion|inscription|oubli)$/.test(r)&&nxt&&nxt[0]==="v")?"v":r[0];
$("#sw").innerHTML=[["c","Client"],["v","Vendeur"],["a","Admin"]].map(s=>`<button class="${s[0]===sp?"on":""}" onclick="nxt='';go('${s[0]}-accueil')">${s[1]}</button>`).join("");
document.body.className=sp==="a"?"adm":"";if(sp==="a"&&sb&&!SL){SL=1;subsLoad()}
$("#sr").innerHTML=sp==="c"?`${ic("search",18)}<input id="q" value="${qs}" placeholder="Rechercher un produit ou une boutique" onkeydown="if(event.key==='Enter'){qs=this.value;kf='Tous';go('c-recherche');render()}">`:`<b>${sp==="v"?"Espace vendeur":"Administration"}</b>`;
$("#cb").style.display=sp==="c"?"":"none";
$("#ub").innerHTML=U?`<button class="ibt" onclick="go('${U.type==="vendeur"?"v-accueil":"c-profil"}')" aria-label="Mon compte">${ic("user",24)}</button>`:`<button class="b" style="padding:7px 12px;font-size:13px" onclick="go('c-connexion')">Connexion</button>`;
$("#bn").innerHTML=NAV[sp].map(n=>`<a class="${n[0]===r?"on":""}" onclick="go('${n[0]}')">${ic(n[1])}${n[2]}</a>`).join("");
const ex=sp==="v"?SUB.v:sp==="a"?SUB.a:SUB.c;
$("#app").innerHTML=`<div class="sub">${ex.map(s=>`<button class="${s[0]===r?"on":""}" onclick="go('${s[0]}')">${s[1]}</button>`).join("")}</div>`+L[r]();
const m=$("#app");m.style.animation="none";void m.offsetWidth;m.style.animation="";window.scrollTo(0,0);
clearInterval(tmr);if(r==="c-accueil")tmr=setInterval(()=>slide(cur+1),4500);
setTimeout(()=>document.querySelectorAll("[data-h]").forEach(b=>b.style.height=b.dataset.h+"%"),50);upd()}
addEventListener("hashchange",render);render();pubLoad();
if(sb){sb.auth.onAuthStateChange((ev)=>{if(ev==="PASSWORD_RECOVERY")setTimeout(()=>go("c-nouveau-mdp"),0)});sb.auth.getSession().then(async({data})=>{if(data&&data.session&&!U){U=await loadProfile(data.session.user);render()}})}
</script></body></html>
